plugins {
    id 'com.android.application'
}

// Set automatically by the GitHub workflow (run number = version code)
def vCode = (System.getenv('APP_VERSION_CODE') ?: '1') as int
def repo  = System.getenv('GITHUB_REPOSITORY') ?: ''

android {
    namespace 'com.rubel.bizsoft'
    compileSdk 34

    defaultConfig {
        applicationId "com.rubel.bizsoft"
        minSdk 29
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        buildConfigField "String", "GITHUB_REPO", "\"${repo}\""
    }

    buildFeatures {
        buildConfig true
    }

    // One fixed key for every build, so a new APK can update the installed app
    signingConfigs {
        main {
            storeFile file('release.jks')
            storePassword 'bizsoft2026'
            keyAlias 'bizsoft'
            keyPassword 'bizsoft2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.main
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.main
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
