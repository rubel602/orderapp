name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use the shared latest software source and clean UI
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("app/src/main/assets/index.html")
          html = page.read_text(encoding="utf-8")
          for filename in ("clean-ui.js", "clean-start.js"):
              script = Path("scripts/" + filename).read_text(encoding="utf-8")
              # The source contains literal closing tags inside generated HTML templates.
              # Anchor to the real final application script, not an embedded template string.
              closing = "</script>\\n</body>\\n</html>"
              close_at = html.rfind(closing)
              if close_at >= 0:
                  body_end = close_at + len("</script>\\n")
                  html = html[:body_end] + "<script>\\n" + script + "\\n</script>\\n" + html[body_end:]
              else:
                  raise SystemExit("Could not find the real HTML closing section")
          page.write_text(html, encoding="utf-8")
          PY
          test -s app/src/main/assets/index.html

      - name: Build signed Android APK
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          export APP_VERSION_CODE="$(git rev-list --count HEAD)"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BusinessSoftwareERP.apk
          test -s BusinessSoftwareERP.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessSoftwareERP-apk
          path: BusinessSoftwareERP.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release with versioned tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" BusinessSoftwareERP.apk \
            --title "Android APK ${GITHUB_RUN_NUMBER}" \
            --notes "Clean-start Android APK built from commit ${GITHUB_SHA}. For the newest APK, use https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/BusinessSoftwareERP.apk"

      - name: Remove older Android APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "BusinessSoftwareERP-apk") | select((.workflow_run.id | tostring) != env.GITHUB_RUN_ID) | .id' | while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
