name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed Android APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BusinessSoftwareERP.apk
          test -s BusinessSoftwareERP.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessSoftwareERP-apk
          path: BusinessSoftwareERP.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest BusinessSoftwareERP.apk --clobber
          else
            gh release create android-latest BusinessSoftwareERP.apk \
              --title "Android (latest)" \
              --notes "Latest signed Android APK for Business Software ERP. Download BusinessSoftwareERP.apk and install it on your Android phone."
          fi

      - name: Remove older Android APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "BusinessSoftwareERP-apk") | select((.workflow_run.id | tostring) != env.GITHUB_RUN_ID) | .id' | while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
