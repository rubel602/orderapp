name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use the shared latest software source
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("app/src/main/assets/index.html")
          html = page.read_text(encoding="utf-8")
          script = Path("scripts/clean-ui.js").read_text(encoding="utf-8")
          marker = "</body>"
          if marker in html:
              html = html.replace(marker, "<script>\\n" + script + "\\n</script>\\n" + marker, 1)
          else:
              html += "\\n<script>\\n" + script + "\\n</script>\\n"
          page.write_text(html, encoding="utf-8")
          PY
          test -s app/src/main/assets/index.html

      - name: Build signed Android APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BusinessSoftwareERP.apk
          test -s BusinessSoftwareERP.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessSoftwareERP-apk
          path: BusinessSoftwareERP.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release with versioned tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" BusinessSoftwareERP.apk \
            --title "Android APK ${GITHUB_RUN_NUMBER}" \
            --notes "Signed Android APK built from commit ${GITHUB_SHA}. For the newest APK, use https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/BusinessSoftwareERP.apk"

      - name: Remove older Android APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.name == "BusinessSoftwareERP-apk") | select((.workflow_run.id | tostring) != env.GITHUB_RUN_ID) | .id' | while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] && gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
