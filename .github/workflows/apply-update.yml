name: Apply update ZIP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'update.zip'
      - 'update (1).zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract update ZIP
        run: |
          set -e
          if [ -f "update.zip" ]; then
            UPDATE_FILE="update.zip"
          elif [ -f "update (1).zip" ]; then
            UPDATE_FILE="update (1).zip"
          else
            echo "No update.zip or update (1).zip found"
            exit 1
          fi
          unzip -o "$UPDATE_FILE" -x '.github/*' '__MACOSX/*'
          rm -f "update.zip" "update (1).zip"

      - name: Commit applied changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed after extracting the ZIP."
          else
            git commit -m "Apply uploaded update ZIP"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Start Android APK build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref "${GITHUB_REF_NAME}"

      - name: Start Windows EXE build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-windows.yml --ref "${GITHUB_REF_NAME}"
