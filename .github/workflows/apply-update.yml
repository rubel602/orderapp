name: Apply update.zip

on:
  push:
    branches: [ main, master ]
    paths:
      - 'update.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract update.zip
        run: |
          if [ ! -f update.zip ]; then echo "No update.zip found"; exit 0; fi
          unzip -o update.zip -x '.github/*' '__MACOSX/*'
          rm -f update.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Apply update.zip"
            git push
          fi

      # pushes made with the default token do not start other workflows, so start the build here
      - name: Start APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml
