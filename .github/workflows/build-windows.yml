name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'update.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the shared source and clean UI
        run: |
          mkdir -p windows/app
          cp index.html windows/app/index.html
          python - <<'PY'
          from pathlib import Path
          page = Path("windows/app/index.html")
          html = page.read_text(encoding="utf-8")
          for filename in ("clean-ui.js", "clean-start.js"):
              script = Path("scripts/" + filename).read_text(encoding="utf-8")
              marker = "</body>"
              if marker in html:
                  html = html.replace(marker, "<script>\n" + script + "\n</script>\n" + marker, 1)
              else:
                  html += "\n<script>\n" + script + "\n</script>\n"
          page.write_text(html, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: windows
        run: npm install

      - name: Set version and update address
        working-directory: windows
        run: |
          npm version 1.0.$(git rev-list --count HEAD) --no-git-tag-version
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.build.publish.url='https://github.com/${{ github.repository }}/releases/download/win-latest';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"

      - name: Build EXE
        working-directory: windows
        run: npx electron-builder --win --publish never

      - name: Upload EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BusinessSoftwareERP-windows
          path: windows/dist/*.exe

      - name: Publish only the newest Windows version
        run: |
          gh release view win-latest >/dev/null 2>&1 || gh release create win-latest --title "Windows (latest)" --notes "Clean-start Windows installer. The app updates itself from here."
          gh release upload win-latest windows/dist/latest.yml windows/dist/BusinessSoftwareERP-Setup-*.exe windows/dist/BusinessSoftwareERP-Portable-*.exe --clobber
          current_version="1.0.$(git rev-list --count HEAD)"
          gh release view win-latest --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            case "$asset" in
              latest.yml|"BusinessSoftwareERP-Setup-$current_version.exe"|"BusinessSoftwareERP-Portable-$current_version.exe") ;;
              *.exe) gh release delete-asset win-latest "$asset" --yes ;;
            esac
          done
