name: Deploy Business ERP Software Samuday Web

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'scripts/web-clean-ui.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          cp index.html web/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("web/index.html")
          html = page.read_text(encoding="utf-8")
          # Web-only cleanup is deliberately used instead of scripts/clean-ui.js,
          # whose broad panel matching can hide the login screen.
          script = Path("scripts/web-clean-ui.js").read_text(encoding="utf-8")
          nl = chr(10)
          closing = "</script>" + nl + "</body>" + nl + "</html>"
          close_at = html.rfind(closing)
          if close_at < 0:
              raise SystemExit("Could not find the final application script and HTML closing tags")
          body_end = close_at + len("</script>" + nl)
          html = html[:body_end] + "<script>" + nl + script + nl + "</script>" + nl + html[body_end:]
          html = html.replace("<title>ERP Software</title>", "<title>Business ERP Software Samuday</title>")
          page.write_text(html, encoding="utf-8")
          if len(html) < 10000:
              raise SystemExit("Prepared web app unexpectedly looks empty")
          if 'id="lu"' not in html or 'id="lp"' not in html:
              raise SystemExit("Login fields were not found in prepared web app")
          if 'Dealer Portal →' not in html:
              raise SystemExit("Dealer Portal link was not found in prepared web app")
          PY
          test -s web/index.html
          cat > web/404.html <<'EOF'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business ERP Software Samuday</title><body><p>Page not found. <a href="./">Open Business ERP Software Samuday</a></p></body></html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
