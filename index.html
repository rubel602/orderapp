<details style="position:relative"><summary class="btn s" style="list-style:none">▥ Columns ▾</summary><div class="dd" style="left:0;right:auto;top:42px">${ECOLS.map(c=>`<label class="sw" style="padding:6px 8px"><input type="checkbox"${ecol[c[0]]?' checked':''} onchange="ecol['${c[0]}']=this.checked?1:0;eRe()">${c[1]}</label>`).join('')}</div></details>

function eRe(){$('etab').innerHTML=etable()}
function sortE(k){esort=esort.k==k?{k,d:-esort.d}:{k,d:1};eRe()}
function pgE(i){epg=Math.max(1,i);eRe()}
function setStt(i,x){S.st.find(a=>a.id==i).stt=x;save();toast('Status: '+x)}
function editEmp(i){eedit=i;keepE=true;go('Add Employee')}
function delEmp(i){if(edel!=i){edel=i;eRe();setTimeout(()=>{edel=0;if($('etab'))eRe()},3000);return}
  edel=0;if(S.pay.some(x=>x.sid==i)||S.so.some(x=>x.by==i))return toast('This employee has salary or delivery records. Set the status to Inactive instead'),eRe();
  S.st=S.st.filter(x=>x.id!=i);S.at=S.at.filter(x=>x.sid!=i);save();toast('Employee deleted');eRe()}
function etable(){const q=eq.toLowerCase(),key=esort.k,l=S.st.filter(x=>(!est||(x.stt||'Active')==est)&&(!q||[x.n,x.bn,x.phone,x.eid,x.nid,x.role,x.dept].join(' ').toLowerCase().includes(q)));
  const gv=(x,k)=>k=='eid'?(parseInt((x.eid||'').replace(/\D/g,''))||0):k=='stt'?(x.stt||'Active'):String(x[k]||'').toLowerCase();
  l.sort((a,b)=>{const A=gv(a,key),B=gv(b,key);return (A>B?1:A<B?-1:0)*esort.d});
  const n=l.length,pages=Math.max(1,Math.ceil(n/epp));if(epg>pages)epg=pages;const st=(epg-1)*epp,rows=l.slice(st,st+epp),vis=ECOLS.filter(c=>ecol[c[0]]);
  const th=vis.map(c=>`<th><button class="sortb" onclick="sortE('${c[2]}')">${c[1].toUpperCase()} ${esort.k==c[2]?(esort.d>0?'↑':'↓'):'↕'}</button></th>`).join('')+'<th class="n">ACTION</th>';
  const cell={id:x=>`<span style="font-family:monospace">${esc(x.eid||'-')}</span>`,name:x=>`<b>${esc(x.n)}</b>${x.bn?'<br><b>'+esc(x.bn)+'</b>':''}`,mobile:x=>`<b>${esc(x.phone||'—')}</b>`,desig:x=>esc(x.role||'—'),dept:x=>esc(x.dept||'—'),status:x=>`<select onchange="setStt(${x.id},this.value)">${ESTAT.map(t=>`<option${(x.stt||'Active')==t?' selected':''}>${t}</option>`).join('')}</select>`};
  const body=rows.map(x=>`<tr>${vis.map(c=>`<td>${cell[c[0]](x)}</td>`).join('')}<td class="n"><button class="btn s" title="Profile" onclick="eview=${x.id};go('Employee Profile')">📁</button> <button class="btn s" onclick="editEmp(${x.id})">Edit</button> <button class="btn s" style="color:var(--neg)" onclick="delEmp(${x.id})">${edel==x.id?'Sure?':'Del'}</button></td></tr>`).join('')||`<tr><td colspan="${vis.length+1}" style="color:var(--mute)">No employees found.</td></tr>`;
  const pn=[...Array(pages)].map((_,i)=>i+1).filter(i=>i==1||i==pages||Math.abs(i-epg)<=2);
  return `<div class="tw"><table><tr>${th}</tr>${body}</table></div><div class="row" style="justify-content:space-between;align-items:center;margin-top:14px"><span style="color:var(--mute)">Showing ${n?st+1:0} to ${Math.min(st+epp,n)} of ${n} entries</span><div class="row"><button class="btn s" onclick="pgE(${epg-1})">‹</button>${pn.map(i=>`<button class="btn${i==epg?'':' s'}" onclick="pgE(${i})">${i}</button>`).join('')}<button class="btn s" onclick="pgE(${epg+1})">›</button></div></div>`}

const EM=[['e_bn','bn'],['e_ds','role'],['e_dp','dept'],['e_fa','fa'],['e_mo','mo'],['e_dob','dob'],['e_gn','gn'],['e_ms','ms'],['e_rl','rl'],['e_bg','bg'],['e_nid','nid'],['e_em','em'],['e_pa','pa'],['e_ra','ra'],['e_rg','rg'],['e_dt','dt'],['e_up','up'],['e_po','po'],['e_jd','join'],['e_et','et'],['e_bk','bk'],['e_bb','bb'],['e_ban','ban'],['e_bac','bac'],['e_bkash','bkash'],['e_nagad','nagad'],['e_rocket','rocket'],['e_en','en'],['e_er','er'],['e_ep','ep'],['e_nt','nt']];

function addEmp(){const e=S.st.find(x=>x.id==eedit)||{},g=k=>esc(e[k]||''),tx=(i,k,ph)=>`<input id="${i}" value="${g(k)}"${ph?' placeholder="'+ph+'"':''}>`,ta=(i,k)=>`<textarea id="${i}" rows="2">${g(k)}</textarea>`,sel=(i,k,a,ph)=>`<select id="${i}">${opt(a,e[k],ph)}</select>`,

<div class="card"><p style="margin:0 0 16px">Quick entry — <b>name</b> and <b>mobile</b> are required. Expand sections below for Bangladeshi employee details.</p><div class="g2">
${fld('Name (English)',tx('e_n','n'),1)}${fld('Name (Bangla)',tx('e_bn_','bn','নাম (বাংলা)').replace('e_bn_','e_bn'))}
${fld('Mobile',tx('e_ph','phone','01XXXXXXXXX'),1)}${fld('Employee ID',`<div class="pl"><span class="pf">#</span><input id="e_id" value="${esc(e.eid||nextEid())}"><button class="plus" style="width:60px" type="button" aria-label="Generate ID" onclick="$('e_id').value=nextEid()">⟳</button></div><span class="mt">Auto: EMP0001 … (you can change it)</span>`,1)}
${fld('Designation',tx('e_ds','role','Sales Executive'))}${fld('Department',tx('e_dp','dept','Sales / Accounts'))}
${cfSlots('emp').length?'<div class="wide" style="grid-column:1/-1"><div class="g2">'+cfFields('emp',e.cf)+'</div></div>':''}<div class="att wide"><b>📎 Attachment</b> <span class="mt">(NID, CV, photo — max 400 KB)</span><input id="e_att" type="file" style="margin-top:8px;width:100%">${e.att?'<span class="mt">Saved: '+esc(e.att.n)+'</span>':''}</div></div></div>
${sec('Personal &amp; NID',e.id,fld("Father's name",tx('e_fa','fa'))+fld("Mother's name",tx('e_mo','mo'))+fld('Date of birth',`<input id="e_dob" type="date" value="${g('dob')}">`)+fld('Gender',sel('e_gn','gn',['Male','Female','Other'],'Select'))+fld('Marital status',sel('e_ms','ms',['Single','Married','Divorced','Widowed'],'Select'))+fld('Religion',sel('e_rl','rl',['Islam','Hinduism','Buddhism','Christianity','Other'],'Select'))+fld('Blood group',sel('e_bg','bg',['A+','A-','B+','B-','AB+','AB-','O+','O-'],'Select'))+fld('NID number',tx('e_nid','nid'))+fld('Email',tx('e_em','em')))}
${sec('Address (Bangladesh)',e.id,W('Present address',ta('e_pa','pa'))+W('Permanent address',ta('e_ra','ra'))+fld('Region (Division)',`<select id="e_rg" onchange="fillDist2()">${opt(Object.keys(BD),e.rg,'Select region')}</select>`)+fld('District',`<select id="e_dt">${opt(BD[e.rg]||[],e.dt,'Select district')}</select>`)+fld('Upazila / Thana',tx('e_up','up'))+fld('Post office',tx('e_po','po')))}
${sec('Job &amp; Salary',e.id,fld('Joining date',`<input id="e_jd" type="date" value="${g('join')}">`)+fld('Employment type',sel('e_et','et',['Full-time','Part-time','Contract','Probation'],'Select'))+fld('Monthly salary (used in payroll)',`<div class="pl"><span class="pf">৳</span><input id="e_sal" type="number" min="0" value="${e.sal||''}"></div>`)+fld('Monthly allowance (used in payroll)',`<div class="pl"><span class="pf">৳</span><input id="e_alw" type="number" min="0" value="${e.alw||''}"></div>`))}
${sec('Bank &amp; Mobile Banking',e.id,fld('Bank name',tx('e_bk','bk'))+fld('Branch',tx('e_bb','bb'))+fld('Account name',tx('e_ban','ban'))+fld('Account number',tx('e_bac','bac'))+fld('bKash number',tx('e_bkash','bkash'))+fld('Nagad number',tx('e_nagad','nagad'))+fld('Rocket number',tx('e_rocket','rocket')))}
${sec('Emergency contact &amp; notes',e.id,fld('Contact name',tx('e_en','en'))+fld('Relation',tx('e_er','er'))+fld('Contact phone',tx('e_ep','ep'))+W('Notes',ta('e_nt','nt')))}
<div class="sbar"><button class="btn s" onclick="eedit=0;go('HR Employees')">Cancel</button><button class="btn big" onclick="saveEmp()">Save employee</button></div></div>`}
function saveEmp(){if(!cfOk('emp'))return;const e=S.st.find(x=>x.id==eedit),n=v('e_n').trim(),ph=v('e_ph').trim(),eid=v('e_id').trim();
  if(!n)return toast('Name (English) is required');if(!ph)return toast('Mobile is required');if(!eid)return toast('Employee ID is required');
  if(S.st.some(x=>x.eid==eid&&x.id!=eedit))return toast('This Employee ID is already used');if(S.st.some(x=>x.phone==ph&&x.id!=eedit))return toast('This mobile number already exists');
  const fl=$('e_att').files[0];if(fl&&fl.size>409600)return toast('Attachment must be under 400 KB');
  const fin=att=>{const o={n,phone:ph,eid,cf:cfRead('emp')};EM.forEach(([i,k])=>{o[k]=v(i).trim()});o.sal=num('e_sal');o.alw=num('e_alw');if(att)o.att=att;
    if(e)Object.assign(e,o);else S.st.push({id:id(S.st),stt:'Active',...o});eedit=0;save();toast('Employee saved');go('HR Employees')};
  if(fl){const r=new FileReader();r.onload=()=>fin({n:fl.name,d:r.result});r.onerror=()=>fin(null);r.readAsDataURL(fl)}else fin(null)}
function eprofile(){const e=S.st.find(x=>x.id==eview);if(!e)return emplist();
  const S2=[['Basic',[['Name (English)','n'],['Name (Bangla)','bn'],['Employee ID','eid'],['Mobile','phone'],['Designation','role'],['Department','dept'],['Status','stt']]],['Personal & NID',[["Father's name",'fa'],["Mother's name",'mo'],['Date of birth','dob'],['Gender','gn'],['Marital status','ms'],['Religion','rl'],['Blood group','bg'],['NID number','nid'],['Email','em']]],['Address',[['Present address','pa'],['Permanent address','ra'],['Region','rg'],['District','dt'],['Upazila / Thana','up'],['Post office','po']]],['Job & Salary',[['Joining date','join'],['Employment type','et'],['Monthly allowance','alw'],['Monthly salary','sal']]],['Bank & Mobile Banking',[['Bank','bk'],['Branch','bb'],['Account name','ban'],['Account number','bac'],['bKash','bkash'],['Nagad','nagad'],['Rocket','rocket']]],['Emergency contact & notes',[['Contact name','en'],['Relation','er'],['Contact phone','ep'],['Notes','nt']]]];
  return `<div style="max-width:860px;margin:0 auto"><div class="hd"><h2 style="margin:0">${esc(e.n)}</h2><div class="row"><button class="btn" onclick="editEmp(${e.id})">Edit</button><button class="btn s" onclick="go('HR Employees')">Back</button></div></div>
${e.att&&/^data:image/.test(e.att.d)?`<div class="card"><img src="${e.att.d}" alt="Attachment" style="max-width:240px;border-radius:8px"></div>`:e.att?`<div class="card">📎 ${esc(e.att.n)}</div>`:''}
${S2.map(([t,f])=>{const r=f.filter(([l,k])=>e[k]||e[k]===0);return r.length?`<div class="card"><h3 style="margin-top:0">${t}</h3><div class="g2">${r.map(([l,k])=>`<div><div class="mt">${l}</div><b>${esc(k=='sal'||k=='alw'?M(e[k]):e[k])}</b></div>`).join('')}</div></div>`:''}).join('')}</div>`}
function products(){return `<h2>Products</h2><div class="card"><div class="row">
<label>Name<input id="n1"></label><label>Sell price<input id="n2" type="number" min="0"></label><label>Cost<input id="n3" type="number" min="0"></label>
<label>Opening stock<input id="n4" type="number" min="0" value="0"></label><label>Low stock alert<input id="n5" type="number" min="0" value="5"></label>
<button class="btn" onclick="addProd()">Add product</button></div></div><div class="card">${tbl(['Product','Price','Cost','Stock','Alert at'],S.p.map(x=>[esc(x.n),M(x.pr),M(x.c),x.s,x.low]),[1,2,3,4])}</div>`}

let XE=null,xF={f:'',t:'',c:''},XC=null;
const xcName=i=>(S.ec.find(c=>c.id==i)||{n:'Uncategorised'}).n;
const xNew=()=>({id:0,dt:ISO(Date.now()).slice(0,10),c:(S.ec[0]||{}).id||'',n:'',a:'',m:'cash',ref:'',note:''});
function expense(){if(!XE)XE=xNew();const e=XE;
  return `<div class="hd"><h2 style="margin:0">${e.id?'Edit Expense':'Add Expense'}</h2>${e.id?`<button class="btn s" onclick="XE=null;go('List Expense')">Cancel</button>`:''}</div>
<div class="card"><div class="g3">${fld('Date',`<input type="date" value="${e.dt}" onchange="XE.dt=this.value">`,1)}${fld('Category',`<select onchange="XE.c=+this.value"><option value="">Uncategorised</option>${S.ec.map(c=>`<option value="${c.id}"${e.c==c.id?' selected':''}>${esc(c.n)}</option>`).join('')}</select>`)}${fld('Title / purpose',`<input value="${esc(e.n)}" placeholder="Rent, salary, electricity" oninput="XE.n=this.value">`,1)}
${fld('Amount',`<input type="number" min="0" step="any" value="${e.a}" oninput="XE.a=this.value">`,1)}${fld('Paid from',`<select onchange="XE.m=this.value"><option value="cash"${e.m=='cash'?' selected':''}>Cash</option><option value="bank"${e.m=='bank'?' selected':''}>Bank</option></select>`)}${fld('Reference / voucher no.',`<input value="${esc(e.ref)}" oninput="XE.ref=this.value">`)}</div>

const xPay=(m,a)=>{if(m=='cash')S.cash-=a;else if(m=='bank')S.bank-=a};
function xSave(){const e=XE,a=+e.a,n=e.n.trim();if(!n||!(a>0))return toast('Enter title and amount');
  const t=new Date(e.dt+'T12:00:00').getTime()||Date.now();
  if(e.id){const o=S.ex.find(x=>x.id==e.id);if(o.m)xPay(o.m,-o.a);xPay(e.m,a);Object.assign(o,{t,n,a,c:+e.c||0,m:e.m,ref:e.ref,note:e.note});act('Expense updated: '+n)}
  else{xPay(e.m,a);S.ex.push({id:id(S.ex),b:bw(),t,n,a,c:+e.c||0,m:e.m,ref:e.ref,note:e.note});act('Expense added: '+n+' '+a)}
  XE=null;save();toast('Expense saved');go('List Expense')}
const exOk=x=>editOk(x.t,bcf('exEd','')!==''?bcf('exEd',''):bcf('trEd',''));

function xDel(i){const x=S.ex.find(a=>a.id==i);if(!exOk(x))return toast('Delete window has passed for this expense');if(!confirm('Delete this expense'+(x.m?' and return '+M(x.a)+' to '+x.m+'?':'?')))return;if(x.m)xPay(x.m,-x.a);S.ex=S.ex.filter(a=>a.id!=i);act('Expense deleted: '+x.n);save();rr()}

<div class="card">${dtx('expl',['Date','Category','Title','Reference','Paid from','Amount','Note','Action'],L.map(x=>[D(x.t),esc(xcName(x.c)),esc(x.n),esc(x.ref||''),x.m?x.m=='bank'?'Bank':'Cash':'-',M(x.a),esc(x.note||''),x.id?sbtn('Edit',`xEdit(${x.id})`,'#2f62ec')+sbtn('Delete',`xDel(${x.id})`,'#e5484d'):'']),[5],{noex:[7]})}</div>`}

<div class="card">${tbl(['Category','Entries','Total','Action'],L.map(c=>{const e=S.ex.filter(x=>x.c==c.id);return[esc(c.n),e.length,M(sum(e,x=>x.a)),sbtn('Edit',`XC=S.ec.find(a=>a.id==${c.id});rr()`,'#2f62ec')+sbtn('Delete',`xcDel(${c.id})`,'#e5484d')]}),[1,2])}</div>`}

const ATD={st:'09:30',grace:15,en:'18:00',off:[5],loc:0,photo:1,auto:1,lvAppr:0,keep:30,hol:[],track:1,tint:5,lv:{Casual:10,Sick:14,Earn:17}};
const ATC=k=>{const a=(S.bs&&S.bs.att)||{};return a[k]==null?ATD[k]:a[k]};
const LVT=()=>Object.keys(ATC('lv'));
const dkey=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const todayK=()=>dkey(Date.now());
const hhmm=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'-';
const isAdm=()=>!!(CU&&(roleOf(CU).all||CU.role==1));
const myEmp=()=>{if(!CU)return null;let e=CU.emp&&S.st.find(x=>x.id==CU.emp);if(e)return e;const n=(CU.n||'').toLowerCase(),u=(CU.uid||'').toLowerCase();return ACT().find(x=>x.n.toLowerCase()==n||x.n.toLowerCase()==u)||null};
let AE=0;
const curEmp=()=>{if(!isAdm())return myEmp();return S.st.find(x=>x.id==AE)||myEmp()||ACT()[0]||null};
const holOf=k=>(ATC('hol')||[]).find(h=>k>=h.f&&k<=(h.t||h.f));
const offDay=k=>ATC('off').includes(new Date(k+'T12:00:00').getDay())||!!holOf(k);
const recOf=(sid,k)=>S.at.find(a=>a.sid==sid&&a.d==k);
const sinceK=sid=>{const r=S.at.filter(a=>a.sid==sid&&(a.src=='app'||a.src=='leave')).map(a=>a.d).sort();return r[0]||''};
function dayInfo(sid,k){const r=recOf(sid,k),t=todayK();
  if(r){if(r.s=='L')return{k:'L',r};if(r.s=='A')return{k:'A',r};return{k:r.late?'late':'P',r}}
  if(offDay(k))return{k:'off'};if(k>t)return{k:'fut'};if(k==t)return{k:'pend'};
  const sk=sinceK(sid);if(ATC('auto')&&sk&&k>=sk)return{k:'A',auto:1};return{k:'none'}}
function autoA(sid,m){if(!ATC('auto'))return 0;let n=0;const [y,mo]=m.split('-').map(Number),dm=new Date(y,mo,0).getDate();for(let d=1;d<=dm;d++){const k=m+'-'+String(d).padStart(2,'0');if(k>=todayK())break;const i=dayInfo(sid,k);if(i.k=='A'&&i.auto)n++}return n}
const cnt=(sid,m)=>{const r=S.at.filter(a=>a.sid==sid&&a.d.startsWith(m));return{P:r.filter(a=>a.s=='P').length,A:r.filter(a=>a.s=='A').length+autoA(sid,m),L:r.filter(a=>a.s=='L').length}};
function purgePh(){const lim=Date.now()-ATC('keep')*864e5;let ch=0;S.at.forEach(a=>{if((a.in||0)<lim&&(a.p1||a.p2)){delete a.p1;delete a.p2;ch=1}});if(ch)save()}

function ltPing(loc,sid){const m=String(loc||'').match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);if(!m||!sid)return;S.lt=S.lt||[];S.lt.push({sid,t:Date.now(),la:+m[1],lo:+m[2]});const lim=Date.now()-3*864e5;S.lt=S.lt.filter(x=>x.t>lim);const mine=S.lt.filter(x=>x.sid==sid);if(mine.length>300){const cut=mine[mine.length-300].t;S.lt=S.lt.filter(x=>x.sid!=sid||x.t>=cut)}save()}
function ltTick(){const e=CU&&myEmp();if(!e||!ATC('track')||!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>ltPing(p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),e.id),()=>{},{timeout:10000,maximumAge:60000})}
function ltStart(){if(LTT||!CU)return;LTT=setInterval(ltTick,Math.max(1,+ATC('tint')||5)*60000);const e=myEmp();const last=e&&(S.lt||[]).filter(x=>x.sid==e.id).slice(-1)[0];if(!last||Date.now()-last.t>60000)ltTick()}
const mapA=(la,lo)=>`<a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener" style="color:#2563eb;font-weight:600">📍 ${la}, ${lo}</a>`;
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h '+(m%60)+' min ago':Math.floor(m/1440)+' day(s) ago'};
function locTrack(){const adm=isAdm(),L=adm?ACT():(myEmp()?[myEmp()]:[]),t=todayK();
  const rows=L.map(x=>{const pts=(S.lt||[]).filter(p=>p.sid==x.id),last=pts[pts.length-1],i=dayInfo(x.id,t),r=i.r,tp=pts.filter(p=>dkey(p.t)==t).length,miss=tp>0&&!(r&&r.in)&&i.k!='off'&&i.k!='L';return{x,last,i,r,tp,miss}});
  const live=rows.filter(o=>o.last&&Date.now()-o.last.t<15*60000).length,miss=rows.filter(o=>o.miss).length;
  const sel=L.find(x=>x.id==LTE),d=LTD||t,hp=sel?(S.lt||[]).filter(p=>p.sid==sel.id&&dkey(p.t)==d).reverse():[];
  const att=o=>o.r&&o.r.in?`<span class="bdg" style="background:#16a34a">Started ${hhmm(o.r.in)}</span>`:o.i.k=='off'?'<span class="bdg" style="background:#6b7280">Off</span>':o.i.k=='L'?'<span class="bdg" style="background:#a16207">Leave</span>':'<span class="bdg" style="background:#dc2626">No Start Work</span>';
  return `<div class="hd"><div><h2 style="margin:0">📡 Location Tracker</h2><div class="sub">Live position of employees using the app · tracking is ${ATC('track')?'ON':'OFF (enable in Attendance Settings)'}</div></div><button class="btn" onclick="ltTick();toast('Refreshing my location…');setTimeout(rr,2500)">⟳ Refresh</button></div>
<div class="grid">${kpi('Employees',L.length)}${kpi('Live now (15 min)',live)}${kpi('Active, Start Work missing',miss)}${kpi('Tracked points (3 days)',(S.lt||[]).length)}</div>
<div class="card"><div class="tw"><table><tr><th>Employee</th><th>Attendance today</th><th>Last seen</th><th>Last location</th><th>Points today</th><th></th></tr>${rows.map(o=>`<tr${o.miss?' style="background:rgba(245,158,11,.12)"':''}><td><b>${esc(o.x.n)}</b><div class="mt">${esc(o.x.role||'')}</div></td><td>${att(o)}${o.miss?'<div class="mt" style="color:#d97706;font-weight:600">⚠ Location active but Start Work missed</div>':''}</td><td>${o.last?hhmm(o.last.t)+'<div class="mt">'+ago(o.last.t)+'</div>':'<span class="mt">Never</span>'}</td><td>${o.last?mapA(o.last.la,o.last.lo):'<span class="mt">No location yet</span>'}</td><td style="text-align:right">${o.tp}</td><td>${sbtn('Route / history',`LTE=${o.x.id};LTD='';rr()`)}</td></tr>`).join('')||'<tr><td colspan="6" class="mt">No employees.</td></tr>'}</table></div></div>
${sel?`<div class="card"><div class="row" style="align-items:end;justify-content:space-between"><b>${esc(sel.n)} — location history</b><div class="row" style="align-items:end"><input type="date" value="${d}" onchange="LTD=this.value;rr()" style="width:auto"><button class="btn" style="background:#6b7280;border-color:#6b7280" onclick="LTE=0;rr()">Close</button></div></div>
${hp.length?`<div class="tw" style="margin-top:10px"><table><tr><th>Time</th><th>Location</th></tr>${hp.map(p=>`<tr><td>${hhmm(p.t)}</td><td>${mapA(p.la,p.lo)}</td></tr>`).join('')}</table></div>`:'<p class="mt" style="margin:10px 0 0">No location points for this date.</p>'}</div>`:''}
<div class="mt" style="margin:8px 4px">Note: a browser can send location only while the app is open on the employee's phone. Location is also recorded at Start Work and End Work.</div>`}

const smKey=()=>{const n=new Date(),m=n.getDate()>=26?new Date(n.getFullYear(),n.getMonth()+1,1):new Date(n.getFullYear(),n.getMonth(),1);return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')};

const smLbl=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
function acPage(){const e=curEmp();if(!e)return noEmp();const adm=isAdm(),t=todayK();S.ac=S.ac||[];
  const sp=smRange(ACM),days=[];for(let d=new Date(sp.f+'T12:00:00');dkey(d)<=sp.t&&dkey(d)<t;d.setDate(d.getDate()+1)){const k=dkey(d),inf=dayInfo(e.id,k);if((inf.k=='A'||inf.k=='none')&&!S.ac.find(a=>a.sid==e.id&&a.d==k&&a.st!='Rejected'))days.push(k)}

${attCard(`<div class="g2" style="align-items:end">${fld('Salary month',`<input type="month" value="${ACM}" onchange="ACM=this.value||smKey();ACF.d='';rr()">`)}<div class="mt" style="padding-bottom:10px">${smLbl(ACM)} salary: <b>${smRange(ACM).f} → ${smRange(ACM).t}</b> (26th to 25th)</div></div><div style="margin-top:6px"><b style="color:${days.length?'#c0392b':'#16a34a'}">Absent: ${days.length} day(s)</b>${days.length?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+days.map(k=>`<button onclick="ACF.d='${k}';rr()" style="border:1px solid ${ACF.d==k?'#2563eb':'#fca5a5'};background:${ACF.d==k?'#2563eb':'#fee2e2'};color:${ACF.d==k?'#fff':'#b91c1c'};border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer">${k.slice(5)} · ${new Date(k+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'})}</button>`).join('')+'</div><div class="mt" style="margin-top:6px">Tap a day to correct it.</div>':''}</div>`)}
${attCard(`<b>Request for an absent day</b><div class="mt" style="margin:4px 0 10px">Missed Start Work or forgot to mark? Pick the absent day and send a request. After approval the day becomes Present.</div>${days.length?`<div class="g2">${fld('Absent day',`<select onchange="ACF.d=this.value"><option value="">Select date</option>${days.map(k=>`<option value="${k}"${ACF.d==k?' selected':''}>${k}</option>`).join('')}</select>`,1)}${fld('Reason',`<input value="${esc(ACF.reason)}" oninput="ACF.reason=this.value" placeholder="Why attendance was missed">`,1)}${fld('Start time',`<input type="time" value="${ACF.in}" onchange="ACF.in=this.value">`)}${fld('End time',`<input type="time" value="${ACF.out}" onchange="ACF.out=this.value">`)}</div><button class="btn" style="margin-top:8px" onclick="acSend()">Send request</button>`:'<p class="mt" style="margin:0">No absent days in this salary month. 👍</p>'}`)}
${adm?`<button class="btn s" style="margin:10px 0" onclick="go('Approval')">Pending requests are approved in Attendance → Approval${(S.ac||[]).filter(a=>a.st=='Pending').length?' ('+(S.ac||[]).filter(a=>a.st=='Pending').length+' waiting)':''}</button>`:''}
<h3 style="margin:18px 4px 10px">My requests</h3>${mine.length?mine.map(a=>attCard(`<div style="display:flex;justify-content:space-between;gap:8px"><div><b>${a.d}</b><div class="mt">${a.in?'Start '+a.in:''}${a.out?' · End '+a.out:''} · ${esc(a.reason||'')}</div></div><div>${bd(a.st)}</div></div>`)).join(''):'<p class="mt" style="margin:4px">No requests yet.</p>'}</div></div>`}
function acSend(){const e=curEmp();if(!e)return;if(!ACF.d)return toast('Select the absent day');if(!ACF.reason.trim())return toast('Enter a reason');
  const a={id:id(S.ac),sid:e.id,d:ACF.d,in:ACF.in,out:ACF.out,reason:ACF.reason.trim(),st:'Pending',t:Date.now(),by:CU?CU.n:''};S.ac.push(a);act('Attendance correction request: '+e.n+' '+a.d);ACF={d:'',in:ACF.in,out:ACF.out,reason:''};save();toast('Request sent for approval');rr()}
function acDecide(i,ok){const a=S.ac.find(x=>x.id==i);if(!a||a.st!='Pending')return;
  if(ok){const mk=h=>h?new Date(a.d+'T'+h+':00').getTime():0,[sh,sm]=ATC('st').split(':').map(Number),inT=mk(a.in),lim=new Date(a.d+'T12:00:00');lim.setHours(sh,sm+ +ATC('grace'),0,0);
    S.at=S.at.filter(r=>!(r.sid==a.sid&&r.d==a.d&&r.s!='L'));const lv=recOf(a.sid,a.d);if(lv)return toast('That day already has a leave record');
    S.at.push({d:a.d,sid:a.sid,s:'P',src:'corr',in:inT||undefined,out:mk(a.out)||undefined,late:inT&&inT>lim.getTime()?1:0,note:a.reason,ac:a.id});a.st='Approved'}
  else a.st='Rejected';a.by2=CU?CU.n:'';act('Attendance correction '+(ok?'approved':'rejected')+': '+sn(a.sid)+' '+a.d);save();rr()}

  return `<style>.ntt{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 16px}.ntt button{background:none;border:0;padding:12px 16px;font-size:15px;font-weight:600;color:var(--mute);cursor:pointer;border-radius:10px 10px 0 0}.ntt button.on{background:var(--panel);color:#4f46e5;box-shadow:0 0 0 1px var(--line)}.ntp{display:inline-block;border-radius:14px;padding:2px 12px;font-weight:700;font-size:13px;border:1px solid transparent;cursor:pointer}.ntp.on{background:#e7f8e7;color:#12a312}.ntp.off{background:#eee;color:#777}.ntg h3{margin:0;padding:14px 18px}.ntg table{width:100%}.ntg th{background:#e6f0fd;color:#333}.ntc{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:2px;cursor:pointer;font-size:13px}</style>
<div class="ntt">${T.map(t=>`<button class="${NT.tab==t[0]?'on':''}" onclick="NT.tab='${t[0]}';NT.ed=null;render()">${t[2]} ${t[1]}</button>`).join('')}</div>`}
function ntp(){NT2();const B={tpl:NT.ed?ntEdit:ntTpl,send:ntSend,gw:ntGw,set:ntSet,rem:ntRem,sc:ntShort}[NT.tab];
  return `<h2 style="margin:0">Notification Template</h2><div class="sub">Manage email, SMS, and in-app message templates from one place.</div>`+ntTabs()+B()}
function ntTpl(){const ev=NT2().ev,gs=[...new Set(ev.map(e=>e.g))];
  return gs.map(g=>`<div class="card ntg" style="padding:0;overflow:hidden"><h3>${g}</h3><div class="tw"><table><tr><th>Event</th><th style="text-align:center">Email</th><th style="text-align:center">In-app</th><th style="text-align:center">SMS</th><th style="text-align:right">Actions</th></tr>${ev.filter(e=>e.g==g).map(e=>`<tr><td><b>${esc(e.n)}</b><br><span class="mt">Edit all channels in one screen</span></td>${['em','ap','sms'].map(c=>`<td style="text-align:center">${e.ch[c]?`<button class="ntp ${e.ch[c].on?'on':'off'}" aria-label="Toggle ${CHN[c]}" onclick="ntTog('${e.id}','${c}')">${e.ch[c].on?'On':'Off'}</button>`:'—'}</td>`).join('')}<td style="text-align:right">${sbtn('✎ Edit',`NT.ed='${e.id}';render()`,'#e5301b')}</td></tr>`).join('')}</table></div></div>`).join('')}
function ntTog(id,c){const x=ntEv(id).ch[c];x.on=x.on?0:1;save();render()}
function ntEdit(){const e=ntEv(NT.ed);if(!e){NT.ed=null;return ntTpl()}const x=e.ch,sm={};
  const sec=(c,body)=>x[c]?`<div class="card"><div class="ch"><b>${CHN[c]}</b>${bsw('nt_'+c+'_on','Enabled','',x[c].on)}</div>${body}</div>`:`<div class="card"><div class="ch"><b>${CHN[c]}</b><span class="mt">Not available for this event</span></div></div>`;
  return `<div class="hd"><h3 style="margin:0">${esc(e.n)} <span class="mt">· ${e.g}</span></h3><button class="btn s" onclick="NT.ed=null;render()">← Back</button></div>
<div class="card"><b>Variables</b> <span class="mt">click to insert into the field you last used</span><div style="margin-top:6px">${NTV.map(v1=>`<span class="ntc" onclick="ntIns('${v1}')">${v1}</span>`).join('')}</div></div>
${sec('em',`<div class="g2">${fld('Subject',`<input id="nt_em_sub" value="${esc(x.em&&x.em.sub)}" onfocus="NT.f=this.id" oninput="ntPv()">`)}<div class="fd wide"><span class="fl">Body</span><textarea id="nt_em_body" rows="6" onfocus="NT.f=this.id" oninput="ntPv()">${esc(x.em&&x.em.body)}</textarea></div></div>`)}
${sec('ap',`<div class="fd wide"><span class="fl">Message</span><textarea id="nt_ap_body" rows="2" onfocus="NT.f=this.id" oninput="ntPv()">${esc(x.ap&&x.ap.body)}</textarea></div>`)}
${sec('sms',`<div class="fd wide"><span class="fl">Message <span class="mt" id="nt_cnt"></span></span><textarea id="nt_sms_body" rows="3" onfocus="NT.f=this.id" oninput="ntPv()">${esc(x.sms&&x.sms.body)}</textarea></div>`)}
<div class="card"><b>Preview (sample data)</b><div id="nt_pv" class="mt" style="white-space:pre-wrap;margin-top:6px"></div></div>
<div class="row"><button class="btn" onclick="ntSave()">💾 Save template</button><button class="btn s" onclick="NT.ed=null;render()">Cancel</button></div>`}
function ntPv(){const e=ntEv(NT.ed),g=i=>$(i)?$(i).value:'',p=[];if(e.ch.em)p.push('✉ '+ntFill(g('nt_em_sub'))+'\n'+ntFill(g('nt_em_body')));if(e.ch.ap)p.push('🔔 '+ntFill(g('nt_ap_body')));if(e.ch.sms){const s=ntFill(g('nt_sms_body'));p.push('💬 '+s);if($('nt_cnt'))$('nt_cnt').textContent=s.length+' characters · '+Math.max(1,Math.ceil(s.length/(/[^\x00-\x7f]/.test(s)?70:160)))+' SMS'}$('nt_pv').textContent=p.join('\n\n')}
function ntIns(t){const el=$(NT.f||'');if(!el)return toast('Click a field first');const a=el.selectionStart||el.value.length;el.value=el.value.slice(0,a)+t+el.value.slice(el.selectionEnd||a);el.focus();ntPv()}
function ntSave(){const e=ntEv(NT.ed);['em','ap','sms'].forEach(c=>{if(!e.ch[c])return;e.ch[c].on=$('nt_'+c+'_on').checked?1:0;e.ch[c].body=v('nt_'+c+'_body');if(c=='em')e.ch[c].sub=v('nt_em_sub')});save();act('Notification template '+e.n+' saved');toast('Template saved');NT.ed=null;render()}
/* Send */
function ntRecips(){const d=NT.sd,ch=d.ch,tp=d.ev?ntEv(d.ev):null;let list=[];
  const one=c=>({name:c.n,to:ch=='em'?(c.em||''):ntPh(c.ph),c});
  if(d.aud=='one'){const c=S.cu.find(x=>x.id==d.cu);if(c)list=[one(c)]}else if(d.aud=='all')list=S.cu.map(one);else if(d.aud=='due')list=S.cu.filter(c=>c.due>0).map(one);else if(d.to.trim())list=d.to.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).map(s=>({name:s,to:ch=='em'?s:ntPh(s),c:null}));
  return list.map(r=>{const c=r.c;let m=ntFill(d.msg,{customer:c?c.n:'Customer',due:c?M(Math.max(0,c.due)):M(0)});const sig=NT2().set.sig;if(sig&&ch!='ap')m+='\n'+sig;return{...r,msg:m,sub:ntFill(d.sub,{customer:c?c.n:'Customer'})}})}
function ntSend(){const d=NT.sd,s=NT2().set,evs=NT2().ev.filter(e=>e.ch[d.ch]),en=s[d.ch]?1:0,L=ntRecips(),sh=d.go?`<div class="card"><div class="ch"><b>${L.length} recipient(s)</b><span class="mt">Open each message in your ${d.ch=='sms'?'SMS':'email'} app</span></div>${L.length?tbl(['Recipient','To','Message',''],L.map((r,i)=>[esc(r.name),esc(r.to||'—'),`<span class="mt">${esc(r.msg.slice(0,80))}</span>`,r.to?sbtn('Open',`ntOpen(${i})`,'#3b82f6'):'<span class="mt">no contact</span>']))+(d.ch=='sms'&&NT2().gw.on&&NT2().gw.url?`<div class="row" style="margin-top:10px"><button class="btn" onclick="ntGwAll()">Send all via gateway</button></div>`:''):'<div class="mt">No recipients found.</div>'}</div>`:'';
  return `<div class="card"><div class="g3">
${fld('Channel',`<select onchange="NT.sd.ch=this.value;NT.sd.ev='';render()">${['sms','em','ap'].map(c=>`<option value="${c}"${d.ch==c?' selected':''}${s[c]?'':' disabled'}>${CHN[c]}${s[c]?'':' (turned off in Settings)'}</option>`).join('')}</select>`)}
${fld('Send to',`<select onchange="NT.sd.aud=this.value;render()">${[['one','One customer'],['all','All customers'],['due','Customers with due'],['custom','Custom numbers / emails']].map(a=>`<option value="${a[0]}"${d.aud==a[0]?' selected':''}>${a[1]}</option>`).join('')}</select>`)}
${d.aud=='one'?fld('Customer',`<select onchange="NT.sd.cu=+this.value;render()"><option value="0">Select customer</option>${S.cu.map(c=>`<option value="${c.id}"${d.cu==c.id?' selected':''}>${esc(c.n)}${c.cid?' · '+esc(c.cid):''}</option>`).join('')}</select>`):d.aud=='custom'?fld('Numbers / emails (comma separated)',`<input value="${esc(d.to)}" oninput="NT.sd.to=this.value">`):`<div></div>`}
${fld('Use template',`<select onchange="ntUse(this.value)"><option value="">— Write own message —</option>${evs.map(e=>`<option value="${e.id}"${d.ev==e.id?' selected':''}>${esc(e.g)} · ${esc(e.n)}</option>`).join('')}</select>`)}
${d.ch=='em'?fld('Subject',`<input value="${esc(d.sub)}" oninput="NT.sd.sub=this.value">`):''}
<div class="fd wide"><span class="fl">Message <span class="mt">variables: ${NTV.join(' ')}</span></span><textarea rows="4" oninput="NT.sd.msg=this.value">${esc(d.msg)}</textarea></div></div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="ntGo()">➤ Prepare &amp; send</button></div></div>${sh}
<div class="card"><div class="ch"><b>Sent log</b><button class="sb" onclick="NT2().log=[];save();render()">Clear</button></div>${tbl(['Time','Channel','To','Message','Status'],NT2().log.slice().reverse().slice(0,40).map(x=>[ISO(x.t),CHN[x.c],esc(x.to),`<span class="mt">${esc(x.m.slice(0,70))}</span>`,esc(x.s)]))}</div>`}
function ntUse(id){const d=NT.sd;d.ev=id;const e=id&&ntEv(id);if(e&&e.ch[d.ch]){d.msg=e.ch[d.ch].body;if(d.ch=='em')d.sub=e.ch.em.sub}render()}
function ntLog(c,to,m,s){const L=NT2().log;L.push({t:Date.now(),c,to,m,s});while(L.length>(NT2().set.keep||200))L.shift()}
function ntGo(){const d=NT.sd;if(!d.msg.trim())return toast('Write a message first');const L=ntRecips();if(!L.length)return toast('No recipient selected');d.go=1;
  if(d.ch=='ap'){L.forEach(r=>ntLog('ap',r.name,r.msg,'Saved in-app'));save();toast('In-app message saved for '+L.length+' recipient(s)');d.go=0;return render()}
  render();if(L.length==1&&L[0].to)ntOpen(0)}
function ntOpen(i){const r=ntRecips()[i];if(!r||!r.to)return toast('No contact');const d=NT.sd;ntLog(d.ch,r.name,r.msg,'Opened in app');save();act((d.ch=='sms'?'SMS':'Email')+' prepared for '+r.name);lnk(d.ch=='sms'?'sms:'+r.to+'?body='+encodeURIComponent(r.msg):'mailto:'+r.to+'?subject='+encodeURIComponent(r.sub)+'&body='+encodeURIComponent(r.msg))}
/* Gateway */
async function ntGwSend(to,msg){const g=NT2().gw,ep=s=>String(s).replace(/\{to\}/g,encodeURIComponent(to)).replace(/\{message\}/g,encodeURIComponent(msg)).replace(/\{key\}/g,encodeURIComponent(g.key)).replace(/\{sender\}/g,encodeURIComponent(g.sid));
  if(!g.url)throw new Error('no url');if(g.prov=='post'){await fetch(g.url.replace(/\{key\}/g,g.key),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:String(g.body).replace(/\{to\}/g,to).replace(/\{message\}/g,msg.replace(/"/g,'\\"').replace(/\n/g,'\\n')).replace(/\{sender\}/g,g.sid).replace(/\{key\}/g,g.key)})}else await fetch(ep(g.url),{mode:'no-cors'})}
async function ntGwAll(){const L=ntRecips().filter(r=>r.to);let n=0;for(const r of L){try{await ntGwSend(r.to,r.msg);ntLog('sms',r.name,r.msg,'Sent to gateway');n++}catch(e){ntLog('sms',r.name,r.msg,'Failed')}}save();toast(n+' of '+L.length+' sent to the gateway');render()}
function ntGw(){const g=NT2().gw;return `<div class="card"><div class="ch"><b>SMS Gateway</b></div>${bsw('gw_on','Use gateway for SMS','When off, SMS opens in your phone\'s SMS app',g.on)}<div class="g2" style="margin-top:12px">
${fld('Request type',`<select id="gw_prov"><option value="get"${g.prov=='get'?' selected':''}>HTTP GET (URL with placeholders)</option><option value="post"${g.prov=='post'?' selected':''}>HTTP POST (body template)</option></select>`)}${fld('Sender ID',`<input id="gw_sid" value="${esc(g.sid)}">`)}
<div class="fd wide"><span class="fl">API URL <span class="mt">placeholders: {to} {message} {key} {sender}</span></span><input id="gw_url" value="${esc(g.url)}" placeholder="https://your-sms-provider.com/api?key={key}&to={to}&msg={message}&sender={sender}"></div>
${fld('API key / token',`<input id="gw_key" type="password" value="${esc(g.key)}">`)}<div class="fd wide"><span class="fl">POST body (for POST type)</span><textarea id="gw_body" rows="3">${esc(g.body)}</textarea></div></div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="ntGwSave()">💾 Save gateway</button></div></div>
<div class="card"><div class="ch"><b>Send test SMS</b></div><div class="row"><label>Mobile number<input id="gw_tn" placeholder="01XXXXXXXXX"></label><button class="btn s" onclick="ntGwTest()">Send test</button></div><p class="mt">Requests go straight from this browser. Many providers block that (CORS) or need a server, so the result cannot be confirmed here; check the phone. If it fails, use the SMS app option instead.</p></div>`}
function ntGwSave(){const g=NT2().gw;g.on=$('gw_on').checked?1:0;g.prov=v('gw_prov');g.sid=v('gw_sid').trim();g.url=v('gw_url').trim();g.key=v('gw_key');g.body=v('gw_body');save();toast('Gateway saved')}
async function ntGwTest(){ntGwSave();const n=ntPh(v('gw_tn'));if(!n)return toast('Enter a mobile number');try{await ntGwSend(n,ntFill('Test message from {business}'));ntLog('sms',n,'Test message','Sent to gateway');save();toast('Request sent. Check the phone.')}catch(e){toast('Could not send: check the URL')}}
/* Settings */
function ntSet(){const s=NT2().set;return `<div class="card"><div class="ch"><b>Channels</b></div>${bsw('ns_em','Email','Allow sending emails',s.em)}${bsw('ns_ap','In-app','Allow in-app messages',s.ap)}${bsw('ns_sms','SMS','Allow sending SMS',s.sms)}</div>
<div class="card"><div class="ch"><b>Defaults</b></div><div class="g3">${fld('Country code for numbers starting with 0',`<input id="ns_cc" value="${esc(s.cc)}">`)}${fld('Keep sent log (entries)',`<input id="ns_keep" type="number" min="10" value="${s.keep}">`)}<div class="fd wide"><span class="fl">Signature added to SMS and email</span><textarea id="ns_sig" rows="2">${esc(s.sig)}</textarea></div></div>
${bsw('ns_qh','Quiet hours','Show a warning before sending between these times',s.qh)}<div class="g3" style="margin-top:8px">${fld('From',`<input id="ns_qf" type="time" value="${s.qf}">`)}${fld('To',`<input id="ns_qt" type="time" value="${s.qt}">`)}</div></div>
<div class="row"><button class="btn" onclick="ntSetSave()">💾 Save settings</button></div>`}
function ntSetSave(){const s=NT2().set;s.em=$('ns_em').checked?1:0;s.ap=$('ns_ap').checked?1:0;s.sms=$('ns_sms').checked?1:0;s.cc=v('ns_cc').trim();s.keep=Math.max(10,+v('ns_keep')||200);s.sig=v('ns_sig');s.qh=$('ns_qh').checked?1:0;s.qf=v('ns_qf');s.qt=v('ns_qt');save();toast('Settings saved');render()}
/* Reminders */
function ntRem(){const r=NT2().rem,due=S.cu.filter(c=>c.due>=(+r.min||0)&&c.due>0),low=S.p.filter(x=>x.es!==false&&!x.ina&&!isRM(x)&&x.s<=x.low);
  return `<div class="card"><div class="ch"><b>Due collection reminder</b></div>${bsw('nr_on','Enable reminder list','Customers with due show below; send with one click',r.on)}<div class="g3" style="margin-top:10px">${fld('Minimum due amount',`<input id="nr_min" type="number" min="0" value="${r.min}">`)}${fld('Remind after (days)',`<input id="nr_days" type="number" min="0" value="${r.days}">`)}${fld('Repeat every (days)',`<input id="nr_every" type="number" min="1" value="${r.every}">`)}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="ntRemSave()">💾 Save</button></div></div>
<div class="card"><div class="ch"><b>Customers with due (${due.length})</b>${due.length?`<button class="btn s" onclick="ntSc('due')">Send reminder to all</button>`:''}</div>${tbl(['Customer','ID','Phone','Due',''],due.map(c=>[esc(c.n),esc(c.cid||'-'),esc(c.ph||'-'),M(c.due),sbtn('Remind',`ntRemOne(${c.id})`,'#3b82f6')]),[3])}</div>
<div class="card"><div class="ch"><b>Low stock (${low.length})</b>${low.length?`<button class="btn s" onclick="ntSc('low')">Write alert</button>`:''}</div>${tbl(['Item','Stock','Alert level'],low.map(x=>[esc(x.n),x.s,x.low]),[1,2])}</div>`}
function ntRemSave(){const r=NT2().rem;r.on=$('nr_on').checked?1:0;r.min=num('nr_min');r.days=num('nr_days');r.every=Math.max(1,num('nr_every'));save();toast('Saved')}
function ntRemOne(id){const e=ntEv('due_rem');NT.sd={ch:'sms',aud:'one',cu:id,to:'',ev:'due_rem',sub:'',msg:e.ch.sms.body,go:0};NT.tab='send';ntGo()}
/* Shortcuts */
function ntSc(k){const e=id=>ntEv(id),S0={ch:'sms',aud:'one',cu:0,to:'',ev:'',sub:'',msg:'',go:0};
  if(k=='due'){NT.sd={...S0,aud:'due',ev:'due_rem',msg:e('due_rem').ch.sms.body}}else if(k=='fest'){NT.sd={...S0,aud:'all',ev:'festival',msg:e('festival').ch.sms.body}}
  else if(k=='low'){const n=S.p.filter(x=>x.es!==false&&!x.ina&&!isRM(x)&&x.s<=x.low).map(x=>x.n).join(', ');NT.sd={...S0,ch:'ap',aud:'custom',to:'Owner',ev:'low_stock',msg:ntFill(e('low_stock').ch.ap.body,{item:n||'-'})}}
  else if(k=='sale'){NT.sd={...S0,ev:'sale_new',msg:e('sale_new').ch.sms.body}}else if(k=='mail'){NT.sd={...S0,ch:'em',aud:'all',ev:'festival',sub:e('festival').ch.em.sub,msg:e('festival').ch.em.body}}
  NT.tab='send';render()}
function ntShort(){const C=[['due','⏰','Due reminders','SMS reminder to every customer with a due balance'],['fest','🎉','Festival greeting','SMS greeting to all customers'],['mail','✉','Festival email','Email greeting to all customers'],['sale','🧾','Sale thank-you','SMS to one customer after a sale'],['low','📦','Low stock alert','In-app alert listing low stock items']];
  return `<style>.nsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.nsg button{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:16px;cursor:pointer}.nsg button:hover{border-color:#4f46e5}.nsg b{display:block;margin:6px 0 2px}</style><div class="nsg">${C.map(c=>`<button onclick="ntSc('${c[0]}')"><span style="font-size:24px">${c[1]}</span><b>${c[2]}</b><span class="mt">${c[3]}</span></button>`).join('')}<button onclick="NT.tab='tpl';render()"><span style="font-size:24px">▤</span><b>Edit templates</b><span class="mt">Open all templates</span></button><button onclick="NT.tab='gw';render()"><span style="font-size:24px">▮▮</span><b>SMS Gateway</b><span class="mt">Set up sending by API</span></button></div>`}

function saveNt(i){const t=S.nt.find(x=>x.id==i);t.sms=v('nt_s'+i);t.sub=v('nt_j'+i);t.em=v('nt_e'+i);save();toast('Template saved')}
function favp(){return `<h2>Favourites</h2><p class="mt" style="margin:0 0 12px">Press the ☆ star in the top bar on any page to add it here.</p><div class="card">${tbl(['Page',''],(S.fv||[]).map(x=>[esc(x),sbtn('Open',`go(this.dataset.p)`,'#2f62ec').replace('<button','<button data-p="'+esc(x)+'"')+sbtn('Remove',`S.fv=S.fv.filter(y=>y!=this.dataset.p);save();render()`,'#e0a100').replace('<button','<button data-p="'+esc(x)+'"')]))}</div>`}

/* ===== Program ===== */
const rgTxt=r=>(r.from||r.to)?(r.from||'…')+' to '+(r.to||'…'):'Always';
function rgForm(){return fld('From',`<input id="pg_f" type="date">`)+fld('To',`<input id="pg_t" type="date">`)}
function rgList(k,h,rows){return `<div class="card">${tbl([...h,'Period','Active',''],rows.map(([r,cells])=>[...cells,rgTxt(r),`<label class="sw" style="margin:0"><input type="checkbox"${r.on!==0?' checked':''} onchange="rgTog('${k}',${r.id},this.checked)"></label>`,sbtn('Delete',`rgDel('${k}',${r.id})`,'#e0a100')]))}</div>`}
function rgTog(k,i,on){S.pg[k].find(x=>x.id==i).on=on?1:0;save();toast(on?'Activated':'Deactivated')}
function rgDel(k,i){S.pg[k]=S.pg[k].filter(x=>x.id!=i);save();render()}
function pdPage(){return `<h2>Products Wise Discount</h2><p class="mt" style="margin:0 0 12px">The discount is filled in automatically when the product is chosen in POS or in a Sales Order.</p><div class="card"><div class="g3">${fld('Product',`<select id="pg_p">${opts(AP())}</select>`,1)}${fld('Discount type',`<select id="pg_y"><option value="%">Percent (%)</option><option value="৳">Amount (৳)</option></select>`)}${fld('Value',`<input id="pg_v" type="number" min="0">`,1)}${rgForm()}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="addPd()">Add discount</button></div></div>`+rgList('pd',['Product','Discount'],S.pg.pd.map(r=>[r,[esc((S.p.find(p=>p.id==r.pid)||{n:'-'}).n),r.val+(r.ty=='%'?'%':' ৳')]]))}

function ilSave(){const n=LY.n.trim();if(!n)return toast('Enter the layout name');if(S.il.some(x=>x.n.toLowerCase()==n.toLowerCase()&&x.id!=LY.id))return toast('This layout name exists');

  const e=S.il.find(x=>x.id==o.id&&o.id),old=e&&e.n;if(o.def)S.il.forEach(x=>x.def=0);let t;if(e){Object.assign(e,o);t=e}else{o.id=id(S.il);S.il.push(o);t=o}
  if(!S.il.some(x=>x.def))t.def=1;if(old&&old!=n)[...S.so,...S.qt].forEach(x=>{if(x.lay==old)x.lay=n});act('Invoice layout saved: '+n);ilv='';LY=null;lyPrev=null;save();toast('Layout saved');render();scrollTo(0,0)}

function challanPage(){const x=S.sa.find(y=>y.id==schV);if(!x)return '<h2>Challan</h2><p class="mt">Nothing to show.</p>';

function editSale(i){const x=S.sa.find(y=>y.id==i);if(!x)return;if(!editOk(x.t,bcf('trEd','')))return toast('Edit window has passed for this sale');if(x.src!='POS'&&x.src!='Classic POS')return toast('Sales made from an order or exchange cannot be edited here. Edit the order instead');if(pfEdit)cancelEdit();
  const idx=S.sa.indexOf(x),c=S.cu.find(y=>y.id==x.cu);x.items.forEach(it=>{const p=S.p.find(y=>y.id==it.id);if(p&&p.es!==false){p.s+=it.q;lgm(p,it.q,'Sale edit (reversed)',x.inv)}});
  S.cash-=cashOf(x);S.bank-=bankOf(x);c.due-=(x.total-x.paid);S.sa.splice(idx,1);pfEdit={id:x.id,uid:x.uid,inv:x.inv,t:x.t,idx,snap:x};
  cart=x.items.filter(it=>!it.free).map(it=>({...it}));pf=pf0();Object.assign(pf,{gn:x.note||'',cu:x.cu,nm:x.cn||'',mb:x.cm||'',emp:x.emp||0,ref:x.ref||'',dt:ISO(x.t).slice(0,10),damt:x.disc||'',vp:x.vatp||'',tr:x.tr||'',cash:cashOf(x)||'',bank:bankOf(x)||''});go('New Sale')}
function cancelEdit(){if(!pfEdit)return;const x=pfEdit.snap,c=S.cu.find(y=>y.id==x.cu),was=pfEdit;x.items.forEach(it=>{const p=S.p.find(y=>y.id==it.id);if(p&&p.es!==false){p.s-=it.q;lgm(p,-it.q,'Sale edit (restored)',x.inv)}});
  S.cash+=cashOf(x);S.bank+=bankOf(x);c.due+=x.total-x.paid;S.sa.splice(Math.min(was.idx,S.sa.length),0,x);pfEdit=null;cart=[];pf=pf0();save();toast('Edit cancelled. Invoice '+was.inv+' restored')}
function delSale(i){const x=S.sa.find(y=>y.id==i);if(!x)return;if(!editOk(x.t,bcf('trEd','')))return toast('Delete window has passed for this sale');if(x.src!='POS'&&x.src!='Classic POS')return toast('Sales made from an order or exchange cannot be deleted here. Cancel or return it through the order');
  if(sdel!=i){sdel=i;render();setTimeout(()=>{if(sdel==i){sdel=0;if(cur=='Sales Record')render()}},3000);return}
  sdel=0;if(x.off){S.svd=S.svd||[];S.svd.push({rc:syRc(x).rc,t:x.t,total:x.total,inv:x.inv||x.id})}const c=S.cu.find(y=>y.id==x.cu);x.items.forEach(it=>{const p=S.p.find(y=>y.id==it.id);if(p&&p.es!==false){p.s+=it.q;lgm(p,it.q,'Sale deleted (reversed)',x.inv)}});
  S.cash-=cashOf(x);S.bank-=bankOf(x);c.due-=x.total-x.paid;S.sa=S.sa.filter(y=>y.id!=i);act('Sale deleted '+x.inv+' '+M(x.total));save();toast('Sale '+x.inv+' deleted. Stock and balances restored');render()}

function pdSave(){const fp=S.p.find(x=>x.id==PD.pid),L=PD.lines.filter(l=>l.id&&l.q>0);if(!fp)return toast('Select the finished product');if(!(PD.q>0))return toast('Enter the output quantity');if(!L.length)return toast('Add at least one raw material');
  const need={};for(const l of L){if(l.id==fp.id)return toast('Finished product cannot be its own material');need[l.id]=(need[l.id]||0)+l.q}
  for(const k in need){const p=S.p.find(x=>x.id==k);if(p.s<need[k])return toast('Not enough stock: '+p.n+' (have '+p.s+', need '+need[k]+')')}
  const no=nextNo('PR',S.prod),items=Object.keys(need).map(k=>{const p=S.p.find(x=>x.id==k);return{id:p.id,n:p.n,q:need[k],c:p.c,tot:rnd(p.c*need[k])}}),mat=sum(items,i=>i.tot),ex=+PD.ex||0,lc=+PD.lc||0,fo=+PD.fo||0,wc=+PD.wc||0,tot=rnd(mat+lc+fo+wc+ex);
  items.forEach(i=>{const p=S.p.find(x=>x.id==i.id);p.s-=i.q;lgm(p,-i.q,'Production (used)',no)});
  const old=Math.max(0,fp.s)*fp.c;fp.s+=PD.q;fp.c=rnd((old+tot)/Math.max(1,Math.max(0,fp.s-PD.q)+PD.q));lgm(fp,PD.q,'Production (output)',no);
  S.prod.push({id:id(S.prod),no,t:new Date(PD.dt).getTime()||Date.now(),b:bw(),bom:PD.bom,pid:fp.id,n:fp.n,q:PD.q,items,mat,lc,fo,wc,ex,tot,unit:rnd(tot/PD.q),note:PD.note,bn:PD.bn||'',md:PD.md||PD.dt,byu:CU?CU.n:''});
  act('Production '+no+': '+fp.n+' x '+PD.q);PD=pdNew();save();toast('Produced '+no);rr()}

 if(c&&used.has(c.id))return toast('This outlet is already in a route');

 let r=rpL().find(x=>x.n.toLowerCase()==rn.toLowerCase());if(!r){r={id:rpL().reduce((m,x)=>Math.max(m,x.id),0)+1,n:rn,days:{}};RPDY.forEach(d=>r.days[d]=[]);rpL().push(r)}
 let k=r.days[dy].find(x=>x.n.toLowerCase()==mn.toLowerCase());if(!k){k={id:rpUid(),n:mn,o:[]};r.days[dy].push(k)}
 if(!c){c={id:id(S.cu),due:0,n:on,name:on,co:'',ph,cid:nextCid('cu'),ad:'',rg:'',dt:'',up:'',zn:'',type:'Customer',em:'',alt:'',sh:'',ad2:'',cp:{n:'',ph:'',role:'',em:''},cf:{}};S.cu.push(c)}
 Object.assign(c,{rt:r.n,dy,rid:r.id});k.o.push({id:rpUid(),cu:c.id});RPSX.r=r.id;RPSX.d=dy;act('Route entry: '+r.n+' / '+dy+' / '+k.n+' / '+c.n);save();toast('Added: '+r.n+' → '+dy+' → '+k.n+' → '+c.n);render()}
function rpQBox(){const used=rpUsed();return `<div class="card" style="margin-bottom:12px"><b>＋ Add route entry</b> <span class="mt">Route → Day → Market → Outlet</span>
<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:10px"><label>Route<input id="rq_r" list="rq_rl" autocomplete="off" placeholder="Type or pick a route"><datalist id="rq_rl">${rpL().map(x=>`<option value="${esc(x.n)}">`).join('')}</datalist></label>
<label>Day<select id="rq_d">${RPDY.map(d=>`<option${RPSX.d==d?' selected':''}>${d}</option>`).join('')}</select></label>
<label>Market<input id="rq_m" list="rq_ml" autocomplete="off" placeholder="Type or pick a market"><datalist id="rq_ml">${[...new Set(rpL().flatMap(r=>RPDY.flatMap(d=>r.days[d].map(k=>k.n))))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
<label>Outlet (shop)<input id="rq_o" list="rq_ol" autocomplete="off" placeholder="Existing customer or new shop name"><datalist id="rq_ol">${S.cu.filter(c=>c.id!=S.cu[0].id&&!used.has(c.id)).map(c=>`<option value="${esc(c.n+(c.cid?' ['+c.cid+']':''))}">`).join('')}</datalist></label>
<label>Mobile <span class="mt">(new shop only)</span><input id="rq_p" inputmode="tel"></label></div>

 if(!r)return h+rpFlat()+`<div class="card"><div style="padding:24px;text-align:center" class="mt">No route yet. Click <b>＋ New route</b> to create the first one (e.g. "Dhaka North"), then add markets and outlets for each day.</div></div>`;
 h+=`<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${L.map(x=>`<button class="btn ${x.id==r.id?'':'s'}" onclick="rpMk(${x.id})">${esc(x.n)} <span style="opacity:.7">(${cnt(x).o})</span></button>`).join('')}</div>

let CIP={m:6};

const lastInc=sid=>S.inc.filter(i=>i.sid==sid&&i.type!='Confirmation').slice(-1)[0];
function hrCI(){const A=ACT(),pm=+CIP.m||6,t=todayK(),R=A.map(x=>{const jd=x.join||'',pe=jd?addM(jd,pm):'',conf=x.conf=='Confirmed';return{x,jd,pe,conf,due:!conf&&pe&&pe<=t,li:lastInc(x.id)}}),yr=t.slice(0,4);
 return hHd('✅ Confirmation &amp; Increment','Probation, confirmation and salary increment — every change keeps a history and can create the letter',`<label style="min-width:160px">Probation period (months)<input type="number" min="1" value="${pm}" onchange="CIP.m=+this.value||6;rr()"></label>`)+`
<div class="grid">${kpi('Employees',A.length)}${kpi('On probation',R.filter(r=>!r.conf).length,'y')}${kpi('Confirmed',R.filter(r=>r.conf).length,'g')}${kpi('Confirmation due',R.filter(r=>r.due).length,'r')}${kpi('Increments in '+yr,S.inc.filter(i=>i.type!='Confirmation'&&i.d.startsWith(yr)).length)}</div><div style="height:12px"></div>
<div class="card">${tbl(['Employee','Designation','Joining date','Probation ends','Status','Current salary','Last increment',''],R.map(({x,jd,pe,conf,due,li})=>[`<b>${esc(x.n)}</b><div class="mt">${esc(x.eid||'')}</div>`,esc(x.role||'—'),jd||'<span class="mt">Not set</span>',pe||'—',conf?`<span class="bdg b-Confirmed">Confirmed${x.cdate?' · '+x.cdate:''}</span>`:due?'<span class="bdg" style="background:#dc2626">Confirmation due</span>':'<span class="bdg b-Draft">Probation</span>',M(+x.sal||0),li?M(li.old)+' → '+M(li.nw)+'<div class="mt">'+li.d+'</div>':'—',(conf?'':sbtn('Confirm',`ciForm(${x.id},'Confirmation')`,'#16a34a'))+sbtn('Increment',`ciForm(${x.id},'Increment')`,'#2563eb')+sbtn('Promotion',`ciForm(${x.id},'Promotion')`,'#7c3aed')]),[5])}</div>
<h3>History</h3><div class="card">${tbl(['Date','Employee','Type','Old salary','New salary','Change','Designation','Note',''],S.inc.slice().reverse().map(i=>[i.d,esc(sn(i.sid)),`<b>${i.type}</b>`,i.type=='Confirmation'&&i.old==i.nw?'—':M(i.old),i.type=='Confirmation'&&i.old==i.nw?'—':M(i.nw),i.nw!=i.old?(i.nw>i.old?'+':'')+M(i.nw-i.old):'—',esc(i.role||'—'),esc(i.note||''),sbtn('Letter',`ciLetter(${i.id})`,'#2563eb')+sbtn('Delete',`ciDel(${i.id})`,'#dc2626')]),[3,4,5])}</div><p class="mt">Confirm / Increment updates the employee's basic salary from the effective date forward in Payroll. Salaries already paid are not changed.</p>`}
function ciForm(i,type){const x=S.st.find(y=>y.id==i),sal=+x.sal||0;accM(`<h3 style="margin:0 0 4px">${type} · ${esc(x.n)}</h3><div class="mt" style="margin-bottom:12px">Current salary ${M(sal)} · ${esc(x.role||'')}</div><div class="cmf"><label>Effective date<input id="ci_d" type="date" value="${todayK()}"></label>${type=='Confirmation'?'':`<label>Increment %<input id="ci_p" type="number" step="0.01" placeholder="e.g. 10" oninput="ciPct(${sal})"></label>`}<label>${type=='Confirmation'?'New salary (optional)':'New salary'}<input id="ci_s" type="number" min="0" value="${type=='Confirmation'?sal:''}"></label>${type=='Promotion'?`<label>New designation<input id="ci_r" value="${esc(x.role||'')}"></label>`:''}<label>Note<input id="ci_n"></label><label class="sw" style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" id="ci_l" checked style="width:auto"> Create letter after saving</label><div class="row" style="gap:8px"><button class="btn" style="flex:1" onclick="ciSave(${i},'${type}')">Save</button><button class="btn s" style="flex:1" onclick="accX()">Cancel</button></div></div>`)}
function ciPct(sal){const p=num('ci_p');$('ci_s').value=p?Math.round(sal*(1+p/100)):''}
function ciSave(i,type){const x=S.st.find(y=>y.id==i),d=v('ci_d'),old=+x.sal||0;let nw=num('ci_s');if(!d)return toast('Select effective date');if(type!='Confirmation'&&!(nw>0))return toast('Enter new salary or %');if(!(nw>0))nw=old;
 const rec={id:id(S.inc),sid:i,type,d,old,nw,note:v('ci_n').trim(),by:CU?CU.n:''};if(type=='Promotion'){rec.role=v('ci_r').trim();if(rec.role)x.role=rec.role}

function scForm(i){const c=i?S.sc.find(y=>y.id==i):{n:'',k:'A',md:'fix',v:0,f:'M'};accM(`<h3 style="margin:0 0 14px">${i?'Edit':'Add'} type</h3><div class="cmf"><label>Name *<input id="sc_n" value="${esc(c.n)}" placeholder="e.g. Eid Bonus"></label><label>Kind<select id="sc_k"><option value="A"${c.k=='A'?' selected':''}>Allowance</option><option value="B"${c.k=='B'?' selected':''}>Bonus</option></select></label><label>Calculation<select id="sc_m"><option value="fix"${c.md=='fix'?' selected':''}>Fixed amount ৳</option><option value="enc"${c.md=='enc'?' selected':''}>Leave encashment (days)</option><option value="pct"${c.md=='pct'?' selected':''}>% of ${HRG()?'gross':'basic'} salary</option></select></label><label>Default value<input id="sc_v" type="number" min="0" step="0.01" value="${c.v}"></label><label>Auto-pay month (one-time types)<select id="sc_sm"><option value="">None — enter manually</option>${MN.map((n,i)=>`<option value="${i+1}"${c.sm==i+1?' selected':''}>Every year in ${n}</option>`).join('')}</select></label><label>Frequency<select id="sc_f"><option value="M"${c.f=='M'?' selected':''}>Every month (automatic)</option><option value="O"${c.f=='O'?' selected':''}>One-time (choose month)</option></select></label><div class="row" style="gap:8px"><button class="btn" style="flex:1" onclick="scSave(${i||0})">Save</button><button class="btn s" style="flex:1" onclick="accX()">Cancel</button></div></div>`)}

function scAssignSave(i){const c=S.sc.find(y=>y.id==i),L=[...document.querySelectorAll('.sa_e:checked')].map(e=>+e.value);if(!L.length)return toast('Select at least one employee');const val=num('sa_v');let n=0;

const prevM=m=>{const [y,mo]=m.split('-').map(Number),d=new Date(y,mo-2,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

function scSaveAll(){const L=[...document.querySelectorAll('input[data-s]')].filter(i=>(i.value.trim())!==(i.dataset.o||'').trim());for(const i of L){const n=+i.value,k=i.dataset.c;if(i.value.trim()!==''&&(!(n>=0)||((k=='bp'||(S.sc.find(y=>y.id==+k)||{}).md=='pct')&&n>100)))return toast('Invalid value — check the red box'),i.style.borderColor='#c0392b'}
 const ot=toast;toast=()=>{};try{L.forEach(i=>{const k=i.dataset.c;if(k=='bp')scBasic(+i.dataset.s,i.value);else scCell(+i.dataset.s,+k,i.value)})}finally{toast=ot}
 const bad=HRG()?ACT().filter(x=>Math.abs(scSplit(x)-100)>0.01).length:0;act('Allowance & bonus saved');save();toast(L.length?'Saved '+L.length+' change(s). Salary is calculated automatically.'+(bad?' '+bad+' employee(s) split is not 100%.':''):'Nothing to save');rr()}

 'Route Plan':[['Route','Day','Market','Outlet','Mobile']].concat((S.rp||[]).flatMap(r=>RPDY.flatMap(d=>(r.days[d]||[]).flatMap(k=>k.o.map(o=>{const c=S.cu.find(x=>x.id==o.cu)||{};return[r.n,d,k.n,c.n||'',c.ph||'']})))))}}
function gsMsg(t,ok){const e=$('gs_st');if(e)e.innerHTML=`<span style="color:var(--${ok?'pos':'neg'})">${esc(t)}</span>`}
async function gsPush(quiet){if(!isAdm())return;if(GSB)return;GSB=1;try{const j=localStorage.getItem(K)||JSON.stringify(S),ch=[];for(let i=0;i<j.length;i+=40000)ch.push(j.slice(i,i+40000));
 const r=await gsCall({a:'push',t:Date.now(),chunks:ch,tabs:gsTabs()});GSL=j;gsSet({last:Date.now(),err:''});if(!quiet){toast('Saved to Google Sheet');gsMsg('Synced '+ISO(Date.now()),1)}}catch(e){gsSet({err:String(e.message||e)});if(!quiet){toast('Sync failed');gsMsg('Failed: '+(e.message||e),0)}}GSB=0}
async function gsPull(){if(!isAdm())return toast('Only an administrator can restore');if(!confirm('Replace ALL data in this app with the data saved in the Google Sheet? A snapshot of the current data is kept first.'))return;
 try{try{await snapPut('Before Google Sheet restore')}catch(e){}const r=await gsCall({a:'pull'});if(!r.d)return toast('The sheet has no saved data yet');const n=JSON.parse(r.d);if(!n||!n.p||!n.cu)throw new Error('Sheet data looks invalid');S=n;fix();save();act('Restored from Google Sheet');save();toast('Restored. Reloading…');setTimeout(()=>location.reload(),900)}catch(e){gsMsg('Restore failed: '+(e.message||e),0);toast('Restore failed')}}
function gsSave(){gsSet({url:v('gs_u').trim(),key:v('gs_k').trim(),auto:$('gs_a').checked});GSL=null;toast('Saved');render()}
async function gsTest(){gsSave();try{await gsCall({a:'ping'});gsMsg('Connected ✔',1)}catch(e){gsMsg('Not connected: '+(e.message||e),0)}}
function gsBox(){if(!isAdm())return '';const c=gsCfg();return `<div class="card" style="margin-top:12px"><b>📗 Google Sheet sync</b> <span class="mt">Data is saved to your own Google Sheet (also readable tabs: Customers, Products, Sales, Collections, Route Plan)</span>
<div class="g2" style="margin-top:10px"><label>Apps Script link (Web app URL)<input id="gs_u" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Secret key (same as in the script)<input id="gs_k" type="password" value="${esc(c.key||'')}" autocomplete="off"></label></div>
<label class="sw" style="margin-top:10px"><input type="checkbox" id="gs_a"${c.auto?' checked':''}>Auto-sync every minute when data changes</label>
<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn s" onclick="gsSave()">Save settings</button><button class="btn s" onclick="gsTest()">Test connection</button><button class="btn" onclick="gsSave();gsPush()">⬆ Sync now</button><button class="btn s" style="color:#dc2626;border-color:#dc2626" onclick="gsPull()">⬇ Restore from Sheet</button></div>
<div id="gs_st" class="mt" style="margin-top:8px">${c.err?`<span style="color:var(--neg)">Last error: ${esc(c.err)}</span>`:c.last?'Last sync: '+ISO(c.last):'Not synced yet'}</div>
${(window.AndroidBridge||window.DesktopBridge)?`<div class="row" style="gap:8px;align-items:center;margin-top:10px"><span class="mt">${window.DesktopBridge?'💻':'📱'} App version ${esc((window.AndroidBridge||window.DesktopBridge).version())}</span><button class="btn s" onclick="(window.AndroidBridge||window.DesktopBridge).checkUpdate()">Check for update</button></div>`:''}<div class="mt" style="margin-top:6px">The sheet keeps a full copy of your data, including login password hashes. Keep that Google Sheet private (do not share it).</div></div>`}
setInterval(()=>{try{const c=gsCfg();if(!c.auto||!c.url||!c.key||!CU||!isAdm()||GSB)return;const j=localStorage.getItem(K);if(j&&j!==GSL)gsPush(true)}catch(e){}},60000);
{const bk2=PAGES['Data Backup'];PAGES['Data Backup']=()=>{const h=bk2(),i=h.indexOf('<div class="card" style="margin-top:12px;border-color:#e5484d">');return i>0?h.slice(0,i)+gsBox()+h.slice(i):h+gsBox()}}
{const r0=render;render=function(){const x=r0.apply(this,arguments);if(authed&&cur=='Data Backup')snapList();return x}}
/* data health check */
function hcScan(){const out=[],bad=[];Object.keys(S).forEach(k=>{const a=S[k];if(!Array.isArray(a)||!a.length||typeof a[0]!='object'||a[0]===null)return;const seen=new Set();let dup=0,nan=0;a.forEach(o=>{if(!o||typeof o!='object')return;if(o.id!==undefined){if(seen.has(o.id))dup++;seen.add(o.id)}Object.keys(o).forEach(f=>{const x=o[f];if(typeof x=='number'&&!isFinite(x)){nan++;bad.push([k,o,f])}})});if(dup)out.push(['Duplicate IDs in "'+k+'"',dup]);if(nan)out.push(['Invalid numbers (NaN) in "'+k+'"',nan])});
  const ns=(S.p||[]).filter(x=>x.s<0).length;if(ns)out.push(['Products with negative stock',ns]);const nu=S.us.filter(u=>!S.rl.some(r=>r.id==u.role)).length;if(nu)out.push(['Users without a valid role',nu]);const np=(S.p||[]).filter(x=>x.pr<x.c&&x.pr>0).length;if(np)out.push(['Products sold below cost price',np]);return{out,bad}}
function hcFix(){if(!isAdm())return;const r=hcScan();r.bad.forEach(([k,o,f])=>{o[f]=0});act('Data health: fixed '+r.bad.length+' invalid numbers');save();toast('Fixed '+r.bad.length+' values');render()}
{const sp0=PAGES['Security Center'];PAGES['Security Center']=()=>{const h=sp0();if(!isAdm())return h;const r=hcScan(),er=(S.er||[]).slice(-10).reverse();let kb=Math.round(JSON.stringify(S).length/1024);
  return h+`<div class="card" style="margin-top:12px"><b>Data health check</b><div class="mt" style="margin:6px 0">Data size: ${kb} KB (browser limit is about 5,000 KB) ${kb>4000?'<b style="color:var(--neg)">— almost full, download a backup and remove old data</b>':''}</div>${r.out.length?tbl(['Problem','Count'],r.out.map(x=>[esc(x[0]),x[1]]),[1])+(r.bad.length?`<div style="margin-top:8px"><button class="btn s" onclick="hcFix()">Fix invalid numbers (set to 0)</button></div>`:''):'<div>✅ No problems found</div>'}</div><div class="card" style="margin-top:12px"><b>Recent software errors</b>${er.length?tbl(['Time','Message','Where'],er.map(x=>[ISO(x.t),esc(x.m),esc(x.w)])):'<div class="mt">None ✅</div>'}</div>`}}

{const g0=go;go=function(m){document.body.classList.remove('navopen');const r=g0.apply(this,arguments);if(m=='Dashboard'){try{window.scrollTo(0,0);const mn=$('main');if(mn)mn.scrollTop=0;document.querySelectorAll('.content,.page').forEach(e=>e.scrollTop=0)}catch(e){}}return r}}

/* one-time automatic fresh start (requested by the owner): clears practice data once on this browser */
try{if(!localStorage.getItem('bs_rmAdore')){localStorage.setItem('bs_rmAdore','1');const n0=S.us.length;S.us=S.us.filter(x=>!(x.id!=1&&(String(x.uid||'').toLowerCase()=='adore'||String(x.n||'').toLowerCase()=='adore')&&!(CU&&CU.id==x.id)));if(S.us.length!=n0){S.al=S.al||[];S.al.push({t:Date.now(),u:'-',m:'User Adore removed'});save()}}}catch(e){}
try{if(!localStorage.getItem('bs_fresh1')){const pre=JSON.stringify(S);localStorage.setItem('bs_fresh1','1');sfDo(SFG.map(g=>g[0]));S.al=[{t:Date.now(),u:'-',m:'Automatic fresh start: practice data cleared'}];save();(async()=>{try{const d=await idb();const tx=d.transaction('s','readwrite');tx.objectStore('s').put({t:Date.now(),l:'Before automatic fresh start',d:pre})}catch(e){}})()}}catch(e){}
render();secAfter();
